<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1a4f">
  <title>BICTDA LMS</title>
  <!-- Self-contained on purpose: this page must work with no internet (no CDN files).
       Shown by the service worker when the user is offline OR while the free server is waking up.
       It checks /ping every few seconds and opens the requested page as soon as the app is ready. -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff;
      background: radial-gradient(40rem 30rem at 10% -10%, rgba(16, 185, 129, .35), transparent 60%),
                  radial-gradient(40rem 30rem at 110% 10%, rgba(59, 99, 243, .45), transparent 60%),
                  linear-gradient(135deg, #0a1a4f 0%, #0b2569 46%, #06483a 100%);
    }
    .card {
      width: 100%; max-width: 420px; text-align: center; padding: 32px 24px; border-radius: 24px;
      background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16);
      -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    }
    img { height: 72px; width: auto; filter: drop-shadow(0 0 10px rgba(255, 255, 255, .3)); }
    .name { margin: 12px 0 0; font-size: 13px; font-weight: 800; letter-spacing: .12em; color: #a7f3d0; }
    h1 { margin: 14px 0 8px; font-size: 24px; }
    p { margin: 0; color: rgba(255, 255, 255, .75); line-height: 1.5; font-size: 15px; }
    .bar { position: relative; height: 6px; margin: 24px auto 0; max-width: 260px; overflow: hidden;
           border-radius: 99px; background: rgba(255, 255, 255, .15); }
    .bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 99px;
                  background: linear-gradient(90deg, #34d399, #60a5fa); animation: slide 1.4s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    .offline .bar { display: none; }
    small { display: block; margin-top: 12px; font-size: 13px; color: rgba(255, 255, 255, .6); }
    button {
      margin-top: 24px; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 15px; font-weight: 700;
      color: #0a1a4f; background: #fff; cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #6ee7b7; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card" id="card">
    <img src="/static/icons/bictda-logo.png" alt="BICTDA logo">
    <p class="name">BICTDA LMS</p>
    <h1 id="title">Starting up&hellip;</h1>
    <p id="message">Please wait a moment while BICTDA LMS gets ready. This page opens by itself when it is ready.</p>
    <div class="bar" aria-hidden="true"></div>
    <small id="timer"></small>
    <button type="button" onclick="openApp()">Try Again</button>
  </main>

  <script>
    var started = Date.now();

    // Open the page the user asked for (or the home page if this file was opened directly)
    function openApp() {
      if (location.pathname === "/static/offline.html") location.replace("/");
      else location.reload();
    }

    function showState() {
      var offline = !navigator.onLine;
      document.getElementById("card").className = "card" + (offline ? " offline" : "");
      document.getElementById("title").textContent = offline ? "You are offline" : "Starting up…";
      document.getElementById("message").textContent = offline
        ? "BICTDA LMS needs an internet connection. Check your data or Wi-Fi - this page will continue by itself when you are back online."
        : "Please wait a moment while BICTDA LMS gets ready. This page opens by itself when it is ready.";
      var seconds = Math.round((Date.now() - started) / 1000);
      document.getElementById("timer").textContent = offline || seconds < 5 ? "" : "Waiting " + seconds + " seconds…";
    }

    // Ask the app if it is ready; only a real BICTDA LMS answer counts (not Render's wake-up page)
    function check() {
      showState();
      if (!navigator.onLine) { setTimeout(check, 3000); return; }
      fetch("/ping", { cache: "no-store" })
        .then(function (response) {
          if (response.ok && response.headers.get("X-BICTDA-App")) openApp();
          else setTimeout(check, 3000);
        })
        .catch(function () { setTimeout(check, 3000); });
    }

    setInterval(showState, 1000);
    check();
  </script>
</body>
</html>
