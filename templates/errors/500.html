{% extends "base.html" %}
{% from "partials/_macros.html" import logo %}
{% set public_page = true %}

{% block public %}
<div class="bictda-hero-bg flex min-h-screen items-center justify-center px-5 py-12 text-white">
  <div class="glass w-full max-w-lg rounded-3xl p-8 text-center sm:p-10">
    <div class="flex justify-center">{{ logo(48, false, "e500") }}</div>
    <p class="mt-6 text-7xl font-extrabold tracking-tight text-gradient">500</p>
    <h1 class="mt-3 text-2xl font-bold">Something went wrong</h1>
    <p class="mt-2 text-sm text-white/70">An unexpected error happened on our side. Please try again in a moment.</p>
    <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
      <a href="{{ home_url }}" class="rounded-xl bg-white px-5 py-3 text-sm font-bold text-royal-950 transition hover:bg-emerald-50">
        <i class="fa-solid fa-house mr-2"></i>Go Home
      </a>
      <button type="button" onclick="location.reload()" class="glass rounded-xl px-5 py-3 text-sm font-bold text-white transition hover:bg-white/15">
        <i class="fa-solid fa-rotate-right mr-2"></i>Try Again
      </button>
    </div>
  </div>
</div>
{% endblock %}
